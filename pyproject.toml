[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "termicast"
version = "0.1.0"
description = "Multi-podcast RSS publishing from the terminal"
requires-python = ">=3.11"
dependencies = ["rich>=13", "lxml>=5", "Pillow>=10", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
termicast = "termicast.cli:main"

[tool.setuptools.packages.find]
include = ["termicast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
